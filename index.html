<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Website</title>
    <!-- Обязательно подключаем стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Секция меню (Hot Items) -->
    <section class="menu-section">
        <h2 class="section-title">Hot Items</h2>
        
        <div class="menu-container">
            <!-- Карточка 1 -->
            <div class="menu-card">
                <img src="assets/MacBook Air (2022).png" alt="Burger" class="card-image">
                <h3 class="card-title">Veggie Burger</h3>
                <p class="card-price">$8.99</p>
                <button class="card-button">Add to Cart</button>
            </div>

            <!-- Карточка 2 -->
            <div class="menu-card">
                <img src="assets/MacBook Air (2022)-1.png" alt="Burger" class="card-image">
                <h3 class="card-title">Classic Cheeseburger</h3>
                <p class="card-price">$10.99</p>
                <button class="card-button">Add to Cart</button>
            </div>
        </div>
    </section>

</body>
</html>
