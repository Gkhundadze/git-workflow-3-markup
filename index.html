<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Food Website</title>
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="logo">
            <a href="#">Burger</a>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Our outlets</a></li>
                <li><a href="#">Order</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-content">
                <div class="badge">
                    <span class="discount">75% OFF</span>
                </div>
                
                <h1 class="hero-title">
                    Burgers That Love the Earth!
                </h1>
                
                <p class="hero-subtitle">
                    Crispy, Crunchy, Veggie Deliciousness!
                </p>
                
                <div class="hero-actions">
                    <a href="#menu" class="btn btn-primary">Explore</a>
                    <a href="#how-it-works" class="btn-link">How to get order...</a>
                </div>

                <div class="hero-ratings">
                    <div class="rating-item">
                        <span class="rating-score">★ 4.5</span>
                    </div>
                    <div class="rating-item">
                        <span class="rating-count">5K+ Happy Review</span>
                    </div>
                </div>
            </div>

            <div class="hero-image-container">
                <img src="./assets/image/burger.png" alt="Veggie Burger">
            </div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <!-- footer -->
    </footer>

</body>
</html>
